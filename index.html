<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>生日祝福</title>
    <!-- 音频元素：静音+预加载+跨格式兼容 -->
    <audio id="bgMusic" loop preload="auto" muted playsinline>
        <source src="music/birthday.mp3" type="audio/mpeg">
        <source src="music/birthday.wav" type="audio/wav"> <!-- 降级兼容 -->
    </audio>
    <style>
        /* 交互引导层：强制可视，覆盖全屏 */
        #playGuide {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            font-size: 18px;
            color: #333;
        }
        #playBtn {
            margin-top: 20px;
            padding: 12px 30px;
            background: #ff6781;
            color: #fff;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- 强制交互引导层（所有浏览器兜底） -->
    <div id="playGuide">
        点击下方按钮播放音乐 🎵
        <button id="playBtn">播放音乐</button>
    </div>

    <script>
        const music = document.getElementById('bgMusic');
        const playGuide = document.getElementById('playGuide');
        const playBtn = document.getElementById('playBtn');

        // 检测浏览器类型
        const browserInfo = {
            isWechat: /MicroMessenger/i.test(navigator.userAgent),
            isIOS: /iPhone|iPad|iPod/i.test(navigator.userAgent),
            isAndroid: /Android/i.test(navigator.userAgent),
            isSafari: /Safari/i.test(navigator.userAgent) && !/Chrome/i.test(navigator.userAgent),
            isChrome: /Chrome/i.test(navigator.userAgent)
        };

        // 核心播放函数（兼容所有浏览器）
        function playAudio() {
            // 1. 解除静音（所有浏览器通用）
            music.muted = false;
            // 2. 尝试播放，捕获所有异常
            music.play()
                .then(() => {
                    console.log('音乐播放成功');
                    playGuide.style.display = 'none'; // 隐藏引导层
                })
                .catch(err => {
                    console.error('播放失败:', err);
                    // 针对不同浏览器给出提示
                    if (browserInfo.isSafari) {
                        playGuide.innerHTML = '请点击页面任意位置<br/>并允许Safari音频权限 🎵<button id="playBtn">重试</button>';
                    } else if (browserInfo.isWechat) {
                        playGuide.innerHTML = '请点击按钮播放<br/>（微信需手动触发） 🎵<button id="playBtn">播放音乐</button>';
                    } else {
                        playGuide.innerHTML = '播放失败，请刷新页面重试 🎵<button id="playBtn">重试</button>';
                    }
                    // 重新绑定按钮事件
                    document.getElementById('playBtn').addEventListener('click', playAudio);
                });
        }

        // 初始化逻辑
        document.addEventListener('DOMContentLoaded', () => {
            // 步骤1：先尝试自动播放（部分浏览器/场景可豁免）
            playAudio();

            // 步骤2：绑定兜底交互事件（覆盖所有触发方式）
            const triggerEvents = ['click', 'touchstart', 'keydown'];
            triggerEvents.forEach(event => {
                // 页面任意位置交互都可触发
                document.body.addEventListener(event, playAudio, { once: true, passive: true });
            });

            // 步骤3：针对特殊浏览器的额外适配
            if (browserInfo.isIOS && browserInfo.isSafari) {
                // iOS Safari：提前激活音频上下文
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                document.body.addEventListener('touchstart', () => {
                    if (audioContext.state === 'suspended') {
                        audioContext.resume(); // 恢复音频上下文
                    }
                }, { once: true });
            }

            if (browserInfo.isWechat) {
                // 微信X5内核：延迟初始化（避免页面未加载完成）
                setTimeout(() => {
                    music.load(); // 重新加载音频（解决微信缓存问题）
                }, 200);
            }
        });
    </script>
</body>

<!-- 摩斯密码表白器容器 - 初始全屏显示 -->
<div id="morse-code-container" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow: hidden;">
    <div class="bg-light min-h-screen flex flex-col items-center justify-center p-4 text-dark relative overflow-hidden w-full h-full">
        <div id="heart-container" class="relative w-full max-w-2xl flex flex-col items-center justify-center py-16">
            <div id="heart" class="text-primary text-[150px] md:text-[200px] opacity-20 transition-opacity duration-300">
                <i class="fa fa-heart"></i>
            </div>
            <div id="message" class="mt-10 text-center max-w-md">
                <p class="text-lg md:text-xl mb-6">这段闪烁的摩斯密码代表着一个秘密信息，你能破译它的含义吗？</p>
                <div id="input-container" class="flex flex-col sm:flex-row gap-3 justify-center">
                    <input type="text" id="answer" placeholder="输入你破译的内容" class="px-4 py-2 rounded-lg border border-secondary focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all">
                    <button id="submit" class="bg-primary hover:bg-primary/90 text-white px-6 py-2 rounded-lg transition-all transform hover:scale-105">
                        提交答案
                    </button>
                </div>
                <div id="result" class="mt-6 text-xl font-medium text-primary hidden"></div>
            </div>
            <!-- 按钮文字修改为「点击它！收下宝宝的生日礼物」 -->
            <button id="restart" class="mt-8 px-6 py-3 bg-secondary hover:bg-secondary/90 text-dark rounded-lg transition-all transform hover:scale-105 hidden">
                点击它！收下宝宝的生日礼物
            </button>
        </div>
        <div id="floating-hearts" class="fixed inset-0 pointer-events-none z-10 hidden"></div>
    </div>
</div>

<!-- Tailwind CSS 和 Font Awesome 资源 -->
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
<script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    primary: '#FF85A2',
                    secondary: '#FFC2D1',
                    light: '#FFF0F3',
                    dark: '#594A4E'
                },
                fontFamily: {
                    sans: ['Inter', 'system-ui', 'sans-serif'],
                },
            }
        }
    }
</script>
<style type="text/tailwindcss">
    @layer utilities {
        .heart-beat {
            animation: heartBeat 1s infinite;
        }
        .morse-dot {
            animation: morseDot 0.5s;
        }
        .morse-dash {
            animation: morseDash 1.5s;
        }
        .float-heart {
            position: absolute;
            opacity: 0;
            animation: floatHeart 6s ease-in-out forwards;
        }
    }

    @keyframes heartBeat {
        0%, 100% { transform: scale(1); }
        14% { transform: scale(1.2); }
        28% { transform: scale(1); }
        42% { transform: scale(1.2); }
        70% { transform: scale(1); }
    }

    @keyframes morseDot {
        0%, 100% { opacity: 0.2; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.2); }
    }

    @keyframes morseDash {
        0%, 100% { opacity: 0.2; transform: scale(1); }
        25% { opacity: 1; transform: scale(1.2); }
        75% { opacity: 1; transform: scale(1.2); }
    }

    @keyframes floatHeart {
        0% {
            bottom: -10%;
            left: var(--start-x);
            transform: scale(0.3) rotate(0deg);
            opacity: 0.8;
        }
        50% {
            transform: scale(0.5) rotate(180deg);
            opacity: 0.6;
        }
        100% {
            bottom: 110%;
            left: var(--end-x);
            transform: scale(0.7) rotate(360deg);
            opacity: 0;
        }
    }
</style>

<!-- 摩斯密码表白器逻辑 -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const heart = document.getElementById('heart');
        const answerInput = document.getElementById('answer');
        const submitBtn = document.getElementById('submit');
        const resultDiv = document.getElementById('result');
        const restartBtn = document.getElementById('restart');
        const floatingHearts = document.getElementById('floating-hearts');
        const morseContainer = document.getElementById('morse-code-container');

        // 摩斯密码映射表（我爱你的摩斯密码）
        const morseCodeMap = {
            '我': '···-·',
            '爱': '·-··',
            '你': '·--'
        };

        // 将"我爱你"转换为摩斯密码数组
        const secretMessage = '我爱你';
        const morseSequence = [];
        for (let char of secretMessage) {
            morseSequence.push(...morseCodeMap[char].split(''));
            morseSequence.push(' '); // 字符间空格
        }
        morseSequence.pop(); // 移除最后一个空格

        let currentIndex = 0;
        let isPlaying = false;
        let animationInterval;

        // 开始播放摩斯密码动画
        function startMorseAnimation() {
            if (isPlaying) return;
            isPlaying = true;
            
            animationInterval = setInterval(() => {
                if (currentIndex >= morseSequence.length) {
                    currentIndex = 0;
                }
                
                const symbol = morseSequence[currentIndex];
                
                // 重置爱心状态
                heart.className = 'text-primary text-[150px] md:text-[200px] transition-opacity duration-300';
                
                if (symbol === '·') {
                    heart.classList.add('morse-dot');
                } else if (symbol === '-') {
                    heart.classList.add('morse-dash');
                } else {
                    // 空格间隔，保持低透明度
                    heart.classList.add('opacity-20');
                }
                
                currentIndex++;
            }, 700);
        }

        // 创建浮动爱心
        function createFloatingHeart() {
            const heart = document.createElement('div');
            heart.className = 'float-heart text-primary';
            heart.innerHTML = '<i class="fa fa-heart"></i>';
            
            // 随机大小
            const size = Math.random() * 20 + 20;
            heart.style.fontSize = `${size}px`;
            
            // 随机起始位置和结束位置
            heart.style.setProperty('--start-x', `${Math.random() * 100}%`);
            heart.style.setProperty('--end-x', `${Math.random() * 100}%`);
            
            // 随机延迟
            heart.style.animationDelay = `${Math.random() * 6}s`;
            
            floatingHearts.appendChild(heart);
            
            // 动画结束后移除元素
            setTimeout(() => {
                heart.remove();
            }, 6000);
        }

        // 大量生成爱心
        function generateHearts() {
            floatingHearts.classList.remove('hidden');
            for (let i = 0; i < 50; i++) {
                setTimeout(createFloatingHeart, i * 150);
            }
        }

        // 检查答案
        submitBtn.addEventListener('click', () => {
            const answer = answerInput.value.trim();
            if (answer === secretMessage) {
                resultDiv.textContent = '恭喜你破译成功！我也爱你 ❤️';
                resultDiv.classList.remove('hidden');
                
                // 停止动画
                clearInterval(animationInterval);
                isPlaying = false;
                
                // 显示「点击它！收下宝宝的生日礼物」按钮
                restartBtn.classList.remove('hidden');
                
                // 隐藏输入框
                document.getElementById('input-container').classList.add('hidden');
                
                // 显示满屏爱心
                generateHearts();
                
                // 让爱心保持高亮跳动
                heart.className = 'text-primary text-[150px] md:text-[200px] heart-beat';
            } else {
                resultDiv.textContent = '再试试吧～';
                resultDiv.classList.remove('hidden');
                setTimeout(() => {
                    resultDiv.classList.add('hidden');
                }, 2000);
            }
        });

        // 核心修改：点击按钮跳转到 shengdanshu.html
        restartBtn.addEventListener('click', () => {
            // 跳转到同目录下的圣诞树页面
            window.location.href = 'shengdanshu.html';
        });

        // 按回车键提交答案
        answerInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                submitBtn.click();
            }
        });

        // 开始摩斯密码动画
        startMorseAnimation();
    });
</script>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宝宝~生日快乐</title>
</head>
<body>
</body>
</html>
