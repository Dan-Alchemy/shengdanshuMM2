<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- 微信X5内核适配关键 -->
    <meta name="webkit-user-select" content="none">
    <title>音乐播放（微信适配）</title>
    <!-- 1. 音频标签优化：预加载+隐藏控件+微信兼容属性 -->
    <audio 
        id="bgMusic" 
        src="music/戚薇、李俊昊 - 你是对的人.mp3" 
        loop 
        preload="auto" 
        x5-playsinline 
        playsinline
        webkit-playsinline
        style="display: none;"
    ></audio>
    
    <!-- 2. 强制用户交互按钮（微信必须） -->
    <style>
        #musicBtn {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 30px;
            font-size: 18px;
            background: #0088ff;
            color: white;
            border: none;
            border-radius: 8px;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <!-- 3. 微信端必须的用户主动点击按钮 -->
    <button id="musicBtn">点击播放音乐</button>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const bgMusic = document.getElementById('bgMusic');
            const musicBtn = document.getElementById('musicBtn');
            
            // 修复点1：微信X5内核音频预加载+上下文初始化
            function initAudio() {
                // 强制创建音频上下文（解决微信音频初始化问题）
                bgMusic.load(); 
                // 静音播放一次（微信触发音频上下文，无声音但初始化）
                bgMusic.muted = true;
                bgMusic.play().then(() => {
                    bgMusic.pause();
                    bgMusic.muted = false;
                }).catch(err => console.log('音频初始化:', err));
            }

            // 修复点2：统一播放逻辑（兼容微信/浏览器/手机/电脑）
            function playMusic() {
                bgMusic.play().then(() => {
                    musicBtn.style.display = 'none'; // 播放后隐藏按钮
                    console.log('音乐播放成功');
                }).catch(error => {
                    console.log('播放失败，需用户点击:', error);
                    // 兜底：再次绑定点击事件
                    musicBtn.addEventListener('click', () => {
                        bgMusic.play().catch(err => console.log('最终播放失败:', err));
                    }, { once: true });
                });
            }

            // 修复点3：微信端强制用户点击触发（核心）
            musicBtn.addEventListener('click', () => {
                playMusic();
            }, { once: true });

            // 修复点4：监听微信页面显示事件（切回微信标签时重新播放）
            document.addEventListener('WeixinJSBridgeReady', () => {
                initAudio(); // 微信环境初始化音频
                // 尝试自动播放（仍可能失败，需按钮兜底）
                playMusic();
            });

            // 通用设备：监听触摸/点击事件（非微信环境）
            document.addEventListener('touchstart', () => {
                playMusic();
            }, { once: true });

            // 初始化执行
            initAudio();

            // 原有摩斯密码动画逻辑
            // startMorseAnimation();
        });
    </script>
</body>

<!-- 摩斯密码表白器容器 - 初始全屏显示 -->
<div id="morse-code-container" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow: hidden;">
    <div class="bg-light min-h-screen flex flex-col items-center justify-center p-4 text-dark relative overflow-hidden w-full h-full">
        <div id="heart-container" class="relative w-full max-w-2xl flex flex-col items-center justify-center py-16">
            <div id="heart" class="text-primary text-[150px] md:text-[200px] opacity-20 transition-opacity duration-300">
                <i class="fa fa-heart"></i>
            </div>
            <div id="message" class="mt-10 text-center max-w-md">
                <p class="text-lg md:text-xl mb-6">这段闪烁的摩斯密码代表着一个秘密信息，你能破译它的含义吗？</p>
                <div id="input-container" class="flex flex-col sm:flex-row gap-3 justify-center">
                    <input type="text" id="answer" placeholder="输入你破译的内容" class="px-4 py-2 rounded-lg border border-secondary focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all">
                    <button id="submit" class="bg-primary hover:bg-primary/90 text-white px-6 py-2 rounded-lg transition-all transform hover:scale-105">
                        提交答案
                    </button>
                </div>
                <div id="result" class="mt-6 text-xl font-medium text-primary hidden"></div>
            </div>
            <!-- 按钮文字修改为「点击它！收下宝宝的生日礼物」 -->
            <button id="restart" class="mt-8 px-6 py-3 bg-secondary hover:bg-secondary/90 text-dark rounded-lg transition-all transform hover:scale-105 hidden">
                点击它！收下宝宝的生日礼物
            </button>
        </div>
        <div id="floating-hearts" class="fixed inset-0 pointer-events-none z-10 hidden"></div>
    </div>
</div>

<!-- Tailwind CSS 和 Font Awesome 资源 -->
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
<script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    primary: '#FF85A2',
                    secondary: '#FFC2D1',
                    light: '#FFF0F3',
                    dark: '#594A4E'
                },
                fontFamily: {
                    sans: ['Inter', 'system-ui', 'sans-serif'],
                },
            }
        }
    }
</script>
<style type="text/tailwindcss">
    @layer utilities {
        .heart-beat {
            animation: heartBeat 1s infinite;
        }
        .morse-dot {
            animation: morseDot 0.5s;
        }
        .morse-dash {
            animation: morseDash 1.5s;
        }
        .float-heart {
            position: absolute;
            opacity: 0;
            animation: floatHeart 6s ease-in-out forwards;
        }
    }

    @keyframes heartBeat {
        0%, 100% { transform: scale(1); }
        14% { transform: scale(1.2); }
        28% { transform: scale(1); }
        42% { transform: scale(1.2); }
        70% { transform: scale(1); }
    }

    @keyframes morseDot {
        0%, 100% { opacity: 0.2; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.2); }
    }

    @keyframes morseDash {
        0%, 100% { opacity: 0.2; transform: scale(1); }
        25% { opacity: 1; transform: scale(1.2); }
        75% { opacity: 1; transform: scale(1.2); }
    }

    @keyframes floatHeart {
        0% {
            bottom: -10%;
            left: var(--start-x);
            transform: scale(0.3) rotate(0deg);
            opacity: 0.8;
        }
        50% {
            transform: scale(0.5) rotate(180deg);
            opacity: 0.6;
        }
        100% {
            bottom: 110%;
            left: var(--end-x);
            transform: scale(0.7) rotate(360deg);
            opacity: 0;
        }
    }
</style>

<!-- 摩斯密码表白器逻辑 -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const heart = document.getElementById('heart');
        const answerInput = document.getElementById('answer');
        const submitBtn = document.getElementById('submit');
        const resultDiv = document.getElementById('result');
        const restartBtn = document.getElementById('restart');
        const floatingHearts = document.getElementById('floating-hearts');
        const morseContainer = document.getElementById('morse-code-container');

        // 摩斯密码映射表（我爱你的摩斯密码）
        const morseCodeMap = {
            '我': '···-·',
            '爱': '·-··',
            '你': '·--'
        };

        // 将"我爱你"转换为摩斯密码数组
        const secretMessage = '我爱你';
        const morseSequence = [];
        for (let char of secretMessage) {
            morseSequence.push(...morseCodeMap[char].split(''));
            morseSequence.push(' '); // 字符间空格
        }
        morseSequence.pop(); // 移除最后一个空格

        let currentIndex = 0;
        let isPlaying = false;
        let animationInterval;

        // 开始播放摩斯密码动画
        function startMorseAnimation() {
            if (isPlaying) return;
            isPlaying = true;
            
            animationInterval = setInterval(() => {
                if (currentIndex >= morseSequence.length) {
                    currentIndex = 0;
                }
                
                const symbol = morseSequence[currentIndex];
                
                // 重置爱心状态
                heart.className = 'text-primary text-[150px] md:text-[200px] transition-opacity duration-300';
                
                if (symbol === '·') {
                    heart.classList.add('morse-dot');
                } else if (symbol === '-') {
                    heart.classList.add('morse-dash');
                } else {
                    // 空格间隔，保持低透明度
                    heart.classList.add('opacity-20');
                }
                
                currentIndex++;
            }, 700);
        }

        // 创建浮动爱心
        function createFloatingHeart() {
            const heart = document.createElement('div');
            heart.className = 'float-heart text-primary';
            heart.innerHTML = '<i class="fa fa-heart"></i>';
            
            // 随机大小
            const size = Math.random() * 20 + 20;
            heart.style.fontSize = `${size}px`;
            
            // 随机起始位置和结束位置
            heart.style.setProperty('--start-x', `${Math.random() * 100}%`);
            heart.style.setProperty('--end-x', `${Math.random() * 100}%`);
            
            // 随机延迟
            heart.style.animationDelay = `${Math.random() * 6}s`;
            
            floatingHearts.appendChild(heart);
            
            // 动画结束后移除元素
            setTimeout(() => {
                heart.remove();
            }, 6000);
        }

        // 大量生成爱心
        function generateHearts() {
            floatingHearts.classList.remove('hidden');
            for (let i = 0; i < 50; i++) {
                setTimeout(createFloatingHeart, i * 150);
            }
        }

        // 检查答案
        submitBtn.addEventListener('click', () => {
            const answer = answerInput.value.trim();
            if (answer === secretMessage) {
                resultDiv.textContent = '恭喜你破译成功！我也爱你 ❤️';
                resultDiv.classList.remove('hidden');
                
                // 停止动画
                clearInterval(animationInterval);
                isPlaying = false;
                
                // 显示「点击它！收下宝宝的生日礼物」按钮
                restartBtn.classList.remove('hidden');
                
                // 隐藏输入框
                document.getElementById('input-container').classList.add('hidden');
                
                // 显示满屏爱心
                generateHearts();
                
                // 让爱心保持高亮跳动
                heart.className = 'text-primary text-[150px] md:text-[200px] heart-beat';
            } else {
                resultDiv.textContent = '再试试吧～';
                resultDiv.classList.remove('hidden');
                setTimeout(() => {
                    resultDiv.classList.add('hidden');
                }, 2000);
            }
        });

        // 核心修改：点击按钮跳转到 shengdanshu.html
        restartBtn.addEventListener('click', () => {
            // 跳转到同目录下的圣诞树页面
            window.location.href = 'shengdanshu.html';
        });

        // 按回车键提交答案
        answerInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                submitBtn.click();
            }
        });

        // 开始摩斯密码动画
        startMorseAnimation();
    });
</script>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宝宝~生日快乐</title>
</head>
<body>
</body>
</html>
