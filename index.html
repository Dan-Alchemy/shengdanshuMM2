<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>摩斯密码表白器 - 背景音乐版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FF85A2',
                        secondary: '#FFC2D1',
                        light: '#FFF0F3',
                        dark: '#594A4E'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .heart-beat { animation: heartBeat 1s infinite; }
            .morse-dot { animation: morseDot 0.5s; }
            .morse-dash { animation: morseDash 1.5s; }
            .float-heart {
                position: absolute;
                opacity: 0;
                animation: floatHeart 6s ease-in-out forwards;
            }
            .music-control {
                position: fixed;
                top: 20px;
                right: 20px;
                z-index: 9999;
                width: 50px;
                height: 50px;
                border-radius: 50%;
                background: rgba(255,133,162,0.9);
                color: white;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                box-shadow: 0 2px 15px rgba(0,0,0,0.2);
                touch-action: manipulation; /* 优化移动端触摸 */
            }
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            14% { transform: scale(1.2); }
            28% { transform: scale(1); }
            42% { transform: scale(1.2); }
            70% { transform: scale(1); }
        }

        @keyframes morseDot {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        @keyframes morseDash {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            25% { opacity: 1; transform: scale(1.2); }
            75% { opacity: 1; transform: scale(1.2); }
        }

        @keyframes floatHeart {
            0% {
                bottom: -10%; left: var(--start-x);
                transform: scale(0.3) rotate(0deg); opacity: 0.8;
            }
            50% { transform: scale(0.5) rotate(180deg); opacity: 0.6; }
            100% {
                bottom: 110%; left: var(--end-x);
                transform: scale(0.7) rotate(360deg); opacity: 0;
            }
        }

        /* 适配移动端点击区域 */
        body {
            touch-action: auto;
            -webkit-tap-highlight-color: transparent; /* 移除移动端点击高亮 */
        }
    </style>
</head>
<body class="bg-light min-h-screen flex flex-col items-center justify-center p-4 text-dark relative overflow-hidden">
    <!-- 核心音频元素：兼容手机+电脑 -->
    <audio 
        id="backgroundMusic" 
        loop 
        preload="auto"  <!-- 预加载音频 -->
        volume="0.8"    <!-- 音量80% -->
    >
        <source src="music/戚薇、李俊昊 - 你是对的人.mp3" type="audio/mpeg">
        您的浏览器不支持音频播放，请升级浏览器
    </audio>

    <!-- 音乐控制按钮（手机/电脑都能点击） -->
    <div class="music-control" id="musicBtn">
        <i class="fa fa-music" id="musicIcon"></i>
    </div>

    <!-- 原有页面内容 -->
    <div id="heart-container" class="relative w-full max-w-2xl flex flex-col items-center justify-center py-16">
        <div id="heart" class="text-primary text-[150px] md:text-[200px] opacity-20 transition-opacity duration-300">
            <i class="fa fa-heart"></i>
        </div>
        <div id="message" class="mt-10 text-center max-w-md">
            <p class="text-lg md:text-xl mb-6">这段闪烁的摩斯密码代表着一个秘密信息，你能破译它的含义吗？</p>
            <div id="input-container" class="flex flex-col sm:flex-row gap-3 justify-center">
                <input type="text" id="answer" placeholder="输入你破译的内容" class="px-4 py-2 rounded-lg border border-secondary focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all">
                <button id="submit" class="bg-primary hover:bg-primary/90 text-white px-6 py-2 rounded-lg transition-all transform hover:scale-105">
                    提交答案
                </button>
            </div>
            <div id="result" class="mt-6 text-xl font-medium text-primary hidden"></div>
        </div>
        <button id="restart" class="mt-8 px-6 py-3 bg-secondary hover:bg-secondary/90 text-dark rounded-lg transition-all transform hover:scale-105 hidden">
            点击它！收下宝宝的生日礼物
        </button>
    </div>
    <div id="floating-hearts" class="fixed inset-0 pointer-events-none z-10 hidden"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // ========== 音频播放核心逻辑（适配手机+电脑） ==========
            const music = document.getElementById('backgroundMusic');
            const musicBtn = document.getElementById('musicBtn');
            const musicIcon = document.getElementById('musicIcon');
            let isMusicPlaying = false;

            // 通用播放函数（处理所有异常）
            function playMusic() {
                // 先尝试静音播放（绕过浏览器限制）
                music.muted = true;
                music.play()
                    .then(() => {
                        // 播放成功后解除静音（手机/电脑通用）
                        music.muted = false;
                        isMusicPlaying = true;
                        musicIcon.classList.remove('fa-music', 'fa-play');
                        musicIcon.classList.add('fa-pause');
                        console.log('音乐播放成功');
                    })
                    .catch(err => {
                        console.log('自动播放失败，等待用户交互:', err);
                        musicIcon.classList.remove('fa-music', 'fa-pause');
                        musicIcon.classList.add('fa-play');
                    });
            }

            // 1. 页面加载后立即尝试播放
            playMusic();

            // 2. 监听所有用户交互（点击/触摸），确保手机/电脑都能触发
            const triggerPlay = () => {
                if (!isMusicPlaying) {
                    music.play()
                        .then(() => {
                            isMusicPlaying = true;
                            musicIcon.classList.remove('fa-music', 'fa-play');
                            musicIcon.classList.add('fa-pause');
                        })
                        .catch(err => console.log('用户交互后播放失败:', err));
                }
                // 只执行一次，避免重复监听
                document.removeEventListener('click', triggerPlay);
                document.removeEventListener('touchstart', triggerPlay);
            };

            // 同时监听点击（电脑）和触摸（手机）
            document.addEventListener('click', triggerPlay);
            document.addEventListener('touchstart', triggerPlay, { passive: true });

            // 3. 手动控制按钮（播放/暂停）
            musicBtn.addEventListener('click', () => {
                if (music.paused) {
                    music.play()
                        .then(() => {
                            isMusicPlaying = true;
                            musicIcon.classList.remove('fa-play');
                            musicIcon.classList.add('fa-pause');
                        })
                        .catch(err => console.log('手动播放失败:', err));
                } else {
                    music.pause();
                    isMusicPlaying = false;
                    musicIcon.classList.remove('fa-pause');
                    musicIcon.classList.add('fa-play');
                }
            });

            // ========== 原有摩斯密码逻辑 ==========
            const heart = document.getElementById('heart');
            const answerInput = document.getElementById('answer');
            const submitBtn = document.getElementById('submit');
            const resultDiv = document.getElementById('result');
            const restartBtn = document.getElementById('restart');
            const floatingHearts = document.getElementById('floating-hearts');

            const morseCodeMap = { '我': '···-·', '爱': '·-··', '你': '·--' };
            const secretMessage = '我爱你';
            const morseSequence = [];
            for (let char of secretMessage) {
                morseSequence.push(...morseCodeMap[char].split(''));
                morseSequence.push(' ');
            }
            morseSequence.pop();

            let currentIndex = 0;
            let isPlaying = false;
            let animationInterval;

            function startMorseAnimation() {
                if (isPlaying) return;
                isPlaying = true;
                animationInterval = setInterval(() => {
                    if (currentIndex >= morseSequence.length) currentIndex = 0;
                    const symbol = morseSequence[currentIndex];
                    heart.className = 'text-primary text-[150px] md:text-[200px] transition-opacity duration-300';
                    if (symbol === '·') heart.classList.add('morse-dot');
                    else if (symbol === '-') heart.classList.add('morse-dash');
                    else heart.classList.add('opacity-20');
                    currentIndex++;
                }, 700);
            }

            function createFloatingHeart() {
                const heart = document.createElement('div');
                heart.className = 'float-heart text-primary';
                heart.innerHTML = '<i class="fa fa-heart"></i>';
                const size = Math.random() * 20 + 20;
                heart.style.fontSize = `${size}px`;
                heart.style.setProperty('--start-x', `${Math.random() * 100}%`);
                heart.style.setProperty('--end-x', `${Math.random() * 100}%`);
                heart.style.animationDelay = `${Math.random() * 6}s`;
                floatingHearts.appendChild(heart);
                setTimeout(() => heart.remove(), 6000);
            }

            function generateHearts() {
                floatingHearts.classList.remove('hidden');
                for (let i = 0; i < 50; i++) setTimeout(createFloatingHeart, i * 150);
            }

            submitBtn.addEventListener('click', () => {
                const answer = answerInput.value.trim();
                if (answer === secretMessage) {
                    resultDiv.textContent = '恭喜你破译成功！我也爱你 ❤️';
                    resultDiv.classList.remove('hidden');
                    clearInterval(animationInterval);
                    isPlaying = false;
                    restartBtn.classList.remove('hidden');
                    document.getElementById('input-container').classList.add('hidden');
                    generateHearts();
                    heart.className = 'text-primary text-[150px] md:text-[200px] heart-beat';
                } else {
                    resultDiv.textContent = '再试试吧～';
                    resultDiv.classList.remove('hidden');
                    setTimeout(() => resultDiv.classList.add('hidden'), 2000);
                }
            });

            restartBtn.addEventListener('click', () => window.location.href = 'shengdanshu.html');
            answerInput.addEventListener('keypress', (e) => e.key === 'Enter' && submitBtn.click());
            startMorseAnimation();
        });
    </script>
</body>
</html>
